# Test configuration
weather.api.url=https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline
weather.api.key=TEST_API_KEY_FOR_TESTING

# API Key Authentication
app.api-key.header-name=X-API-Key
app.api-key.value=${WEATHER_API_KEY:TEST_API_KEY_FOR_TESTING}
app.api-key.enabled=true

# Rate limiting
app.rate-limit.capacity=20
app.rate-limit.refill-tokens=10
app.rate-limit.refill-duration=1

# Redis configuration (disabled for tests)
spring.data.redis.enabled=false

# Cache configuration
app.cache.time-to-live=60000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
