name: weatherly-api
services:
  - name: api
    github:
      repo: mdhamed238/weatherly
      branch: main
      deploy_on_push: true
    build_command: mvn clean package -DskipTests
    run_command: java -jar target/weatherly-0.0.1-SNAPSHOT.war
    http_port: 8080
    instance_size_slug: basic-xxs
    envs:
      - key: WEATHER_API_KEY
        value: "${WEATHER_API_KEY}"
        scope: RUN_TIME
        type: SECRET
      - key: APP_API_KEY_ENABLED
        value: "true"
      - key: SERVER_PORT
        value: "8080"